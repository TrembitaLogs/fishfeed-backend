# Production Docker Compose — nginx-on-host variant used on ff (Contabo).
# The project runs behind a host-level nginx (not Traefik); the API is
# published only on 127.0.0.1:8000 so the host-side nginx proxy is the
# single public ingress.
#
# Prerequisites on the target host:
#   1. ./secrets/*.txt files populated (admin_username, admin_password,
#      jwt_secret_key, session_secret_key, postgres_password)
#   2. ./.env populated from .env.example (S3 creds, APP_VERSION, etc.)
#   3. ./backups/ directory writable by the container user (bind target for
#      the database-backup service)
#
# Deploy:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# On ff this file is copied to docker-compose.yml so `scripts/deploy.sh`
# (invoked by the GitHub Actions deploy workflow) finds it without needing
# the `-f` flag.

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-TrembitaLogs/fishfeed-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # bind only to loopback; nginx on host proxies in
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - admin_username
      - admin_password
      - jwt_secret_key
      - session_secret_key
      - postgres_password
    env_file: .env
    environment:
      # api serves HTTP/admin only; the scheduler runs solely in the worker service.
      # Without this the api also starts APScheduler (WORKER_ENABLED defaults to True),
      # duplicating the worker and risking a busy-loop CPU spin.
      - WORKER_ENABLED=false
      # Override DB / Redis to point at internal service names
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/fishfeed
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - ENVIRONMENT=production
      - FCM_CREDENTIALS_PATH=/app/secrets/firebase-credentials.json
      - APNS_KEY_PATH=/app/secrets/AuthKey.p8
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-credentials.json
    volumes:
      - ./secrets:/app/secrets:ro
      - ./mobile/releases:/app/mobile/releases:ro
      - ./backups:/var/backups/fishfeed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fishfeed-internal

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-TrembitaLogs/fishfeed-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.workers.feeding_worker"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - postgres_password
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/fishfeed
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENABLED=true
      - ENVIRONMENT=production
      - FCM_CREDENTIALS_PATH=/app/secrets/firebase-credentials.json
      - APNS_KEY_PATH=/app/secrets/AuthKey.p8
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-credentials.json
    volumes:
      - ./secrets:/app/secrets:ro
      - ./backups:/var/backups/fishfeed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fishfeed-internal

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fishfeed
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishfeed-internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishfeed-internal

secrets:
  admin_username:
    file: ./secrets/admin_username.txt
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  session_secret_key:
    file: ./secrets/session_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  fishfeed-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
