[project]
name = "backend"
version = "0.1.0"
description = "FishFeed Backend API"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "argon2-cffi>=25.1.0",
    "redis>=7.1.0",
    "httpx>=0.28.1",
    "greenlet>=3.3.0",
    "email-validator>=2.3.0",
    "google-auth[requests]>=2.40.0",
    "PyJWT[crypto]>=2.10.0",
    "apscheduler>=4.0.0a6",
    "sniffio>=1.3.1",
    "structlog>=25.1.0",
    "pillow>=11.0.0",
    "aioboto3>=14.0.0",
    "python-multipart>=0.0.26",
    "firebase-admin>=6.6.0",
    "sqladmin>=0.22.0",
    "aioapns>=3.1",
    "sentry-sdk[fastapi]>=2.19.0",
    "itsdangerous>=2.2.0",
    "aiosmtplib>=3.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.14.11",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "schemathesis>=4.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["alembic/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841", "E501"]  # Unused variables and long lines OK in tests
"app/api/**/*.py" = ["B008"]  # FastAPI Query/Depends in default args is idiomatic

[tool.pytest.ini_options]
markers = [
    "schemathesis: OpenAPI conformance fuzz tests (slow; opt-in via -m schemathesis)",
]
# Exclude schemathesis-marked tests from the default run so the main test suite
# stays fast. Run them explicitly with `uv run pytest -m schemathesis`.
addopts = "-m 'not schemathesis'"

[tool.mypy]
python_version = "3.14"
# Pragmatic strict options
disallow_untyped_defs = true
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
# For libraries without stubs
ignore_missing_imports = true
# Don't require generic parameters (too noisy with SQLAlchemy)
disallow_any_generics = false
