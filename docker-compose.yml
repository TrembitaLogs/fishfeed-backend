services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./mobile/releases:/app/mobile/releases:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fishfeed
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - fishfeed-network

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fishfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fishfeed-network

  redis:
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fishfeed-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fishfeed
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "python", "-m", "app.workers.feeding_worker"]
    volumes:
      - ./app:/app/app
    networks:
      - fishfeed-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seed-species:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fishfeed
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "python", "scripts/seed_species.py"]
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - fishfeed-network
    profiles:
      - seed

networks:
  fishfeed-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
